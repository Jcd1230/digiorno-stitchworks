[package]
name = "designer1-tools"
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
description = "Rust tools for Husqvarna/Viking Designer 1 embroidery files, disks, and Gotek media"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Jcd1230/digiorno-stitchworks"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.1", features = ["derive"] }
eframe = { version = "0.34.3", default-features = true }
egui = "0.34.3"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
semver = "1.0"
tempfile = "3.27"
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.4", default-features = false, features = ["deflate-flate2", "flate2"] }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.61.2", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[lib]
name = "designer1_tools"
path = "src/lib.rs"

[[bin]]
name = "designer1-cli"
path = "src/bin/designer1-cli.rs"

[[bin]]
name = "designer1"
path = "src/bin/designer1.rs"

[[bin]]
name = "designer1-gui"
path = "src/bin/designer1-gui.rs"

[[bin]]
name = "designer1-gotek"
path = "src/bin/designer1-gotek.rs"
